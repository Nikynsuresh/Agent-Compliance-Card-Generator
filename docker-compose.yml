version: '3.8'

services:
  agent-compliance-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-compliance-api
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./agent_compliance.db
      - SECRET_KEY=agent-compliance-production-jwt-key-2026-secure
      - GEMINI_API_KEY=${GEMINI_API_KEY:-""}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
